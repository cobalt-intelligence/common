name: Publish to npm
# Publishes cobalt-int-common when master holds a version the registry does not have yet (a version bump merged
# through a pull request). Every other push to master ends at the version check and publishes nothing.
#
# No token is stored: npm trusts this workflow through OpenID Connect (the package's Trusted Publisher setting on
# npmjs.com names this repository and this file), so the job needs id-token: write and an npm that speaks it.
on:
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write

# One publish at a time. queue: max keeps every waiting run, so a version bump that merges while two others are
# ahead of it is still published instead of being replaced by the newest one.
concurrency:
  group: publish-npm
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships an older one.
      - run: npm install --global npm@11
      - name: Compare the package version with the registry
        id: version
        run: |
          PACKAGE_NAME=$(node --print "require('./package.json').name")
          PACKAGE_VERSION=$(node --print "require('./package.json').version")
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version > /dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already on the registry; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # npm refuses to move latest backwards, so a version below the registry's latest (two bumps whose runs
          # finished out of order) goes out under its own tag and latest stays where it is.
          LATEST_VERSION=$(npm view "${PACKAGE_NAME}" dist-tags.latest 2> /dev/null || true)
          LOWER_VERSION=$(printf '%s\n%s\n' "${PACKAGE_VERSION}" "${LATEST_VERSION}" | sort --version-sort | head -n 1)
          if [ -n "${LATEST_VERSION}" ] && [ "${LOWER_VERSION}" = "${PACKAGE_VERSION}" ]; then
            DIST_TAG=backfill
          else
            DIST_TAG=latest
          fi
          echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is not on the registry (latest there: ${LATEST_VERSION:-none}); publishing with tag ${DIST_TAG}"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=${DIST_TAG}" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.publish == 'true'
        run: npm ci
      - if: steps.version.outputs.publish == 'true'
        run: npm test
      # prepublishOnly builds dist; the package's files list keeps tests out of the tarball.
      - if: steps.version.outputs.publish == 'true'
        run: npm publish --tag "${DIST_TAG}"
        env:
          DIST_TAG: ${{ steps.version.outputs.tag }}
